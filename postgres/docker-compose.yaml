services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # Mount the local SQL file into the container's initialization directory
      - ./customer-support.sql:/docker-entrypoint-initdb.d/customer-support.sql
